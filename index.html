<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игрушечное Такси - Пассажир</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #f0fdf4;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #166534; font-size: 20px; margin: 5px 0; }

        .connect-panel {
            width: 100%;
            max-width: 450px;
            background: #15803d;
            color: white;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 10px;
            text-align: center;
        }
        .net-input { width: 50%; padding: 8px; font-size: 18px; border-radius: 6px; border: none; text-align: center; font-weight: bold; }
        .connect-btn { background: #1e293b; color: white; border: none; padding: 8px 15px; font-size: 15px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-left: 5px; }

        .order-panel {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 10px;
        }
        .status-box { background: #f3f4f6; padding: 10px; border-radius: 8px; text-align: center; font-weight: bold; color: #374151; margin-bottom: 10px; font-size: 15px; white-space: pre-line; }
        .selector-group { display: flex; gap: 10px; margin-bottom: 10px; }
        .select-box { flex: 1; padding: 10px; font-size: 14px; border-radius: 8px; border: 2px solid #bbf7d0; font-weight: bold; }
        .order-btn { background: #16a34a; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 8px; width: 100%; cursor: pointer; }
        .order-btn:disabled { background: #d1d5db; color: #9ca3af; cursor: not-allowed; }

        .map-container { 
            width: 100%;  
            max-width: 450px;
            height: 350px; 
            position: relative; 
            background: #cbd5e1;
            border-radius: 16px;
            border: 3px solid #16a34a;
            overflow: hidden;
            margin-bottom: 10px;
        }
        
        .passenger-room { position: absolute; background: rgba(255, 255, 255, 0.9); border: 3px solid #16803d; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #14532d; font-size: 14px; text-align: center; pointer-events: none; }
        .passenger-room.highlight-target { border-color: #ef4444; background: rgba(254, 226, 226, 0.9); box-shadow: 0 0 12px #ef4444; }

        .taxi-marker { width: 36px; height: 36px; background-color: #f59e0b; border: 3px solid #111827; border-radius: 50%; position: absolute; display: flex; align-items: center; justify-content: center; font-size: 18px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); transition: all 0.3s ease-in-out; z-index: 100; display: none; }
        
        /* СТИЛИ ЧАТА */
        .chat-panel { width: 100%; max-width: 450px; background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); padding: 10px; display: flex; flex-direction: column; gap: 5px; }
        .chat-box { width: 100%; height: 100px; border: 1px solid #e5e7eb; border-radius: 8px; overflow-y: auto; padding: 8px; font-size: 13px; background: #f9fafb; }
        .chat-msg { margin-bottom: 4px; line-height: 1.4; word-break: break-all; }
        .chat-msg.driver { color: #1e3a8a; }
        .chat-msg.passenger { color: #15803d; }
        .chat-input-row { display: flex; gap: 5px; }
        .chat-input { flex: 1; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
        .chat-send-btn { background: #16a34a; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <h1>🚖 Вызов Игрушечного Такси</h1>

    <div class="connect-panel">
        <div id="connStatus" style="margin-bottom:8px; font-weight:bold;">🔴 Вы не подключены</div>
        <input type="number" id="driverIdInput" class="net-input" placeholder="Код водителя">
        <button class="connect-btn" onclick="connectToDriver()">Войти</button>
    </div>

    <div class="order-panel">
        <div id="statusBox" class="status-box">Введите 4 цифры для подключения</div>
        <div class="selector-group">
            <select id="selectA" class="select-box" disabled><option>Откуда...</option></select>
            <select id="selectB" class="select-box" disabled><option>Куда...</option></select>
        </div>
        <button id="orderBtn" class="order-btn" onclick="sendOrder()" disabled>Заказать такси</button>
    </div>

    <div class="map-container" id="map">
        <div id="taxi" class="taxi-marker">🚖</div>
    </div>

    <div class="chat-panel">
        <div class="chat-box" id="chatBox">
            <div style="color:#9ca3af;font-style:italic;text-align:center;">Чат недоступен. Подключитесь к водителю...</div>
        </div>
        <div class="chat-input-row">
            <input type="text" id="chatInput" class="chat-input" placeholder="Написать водителю..." disabled onkeydown="if(event.key==='Enter') sendChatMessage()">
            <button id="chatSendBtn" class="chat-send-btn" onclick="sendChatMessage()" disabled>Отправить</button>
        </div>
    </div>

    <script>
        let peer = null;
        let conn = null;
        let mapRooms = [];

        const mapContainer = document.getElementById('map');
        const taxiMarker = document.getElementById('taxi');
        const chatBox = document.getElementById('chatBox');

        function connectToDriver() {
            const shortId = document.getElementById('driverIdInput').value.trim();
            if (shortId.length !== 4) return alert("Введите 4 цифры!");

            document.getElementById('connStatus').innerText = "⏳ Подключение к " + shortId + "...";
            
            if (peer) peer.destroy();
            
            peer = new Peer();
            peer.on('open', () => {
                // Было так:
//conn = peer.connect(shortId);

// Замени на вот так:
conn = peer.connect("danil-taxi-id-" + shortId);
                

                conn.on('open', () => {
                    document.getElementById('connStatus').innerText = "🟢 Подключено к [" + shortId + "]";
                    document.getElementById('statusBox').innerText = "Карта получена!";
                    document.getElementById('orderBtn').disabled = false;
                    document.getElementById('selectA').disabled = false;
                    document.getElementById('selectB').disabled = false;
                    
                    // Включаем чат
                    document.getElementById('chatInput').disabled = false;
                    document.getElementById('chatSendBtn').disabled = false;
                    chatBox.innerHTML = '<div style="color:#1e3a8a; text-align:center;">Вы подключились к водителю</div>';
                });

                conn.on('data', (data) => {
                    if (data.type === 'INIT_MAP') { mapRooms = data.map; buildPassengerMap(); }
                    if (data.type === 'MOVE_TAXI') { moveTaxiMarker(data.roomId); }
                    if (data.type === 'STATUS') { document.getElementById('statusBox').innerText = data.text; }
                    if (data.type === 'HIGHLIGHT') {
                        document.querySelectorAll('.passenger-room').forEach(r => r.classList.remove('highlight-target'));
                        const target = document.getElementById('p_' + data.idB);
                        if(target) target.classList.add('highlight-target');
                    }
                    // Ловим текстовые сообщения от водителя
                    if (data.type === 'CHAT') {
                        addMessageToBox('Водитель', data.text, 'driver');
                    }
                });

                conn.on('close', () => {
                    alert("Соединение закрыто водителем.");
                    location.reload();
                });
            });
            
            peer.on('error', (err) => {
                alert("Ошибка! Проверьте, запущен ли таксометр водителя.");
                document.getElementById('connStatus').innerText = "🔴 Ошибка";
            });
        }

        // Логика чата: отправка сообщения
        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            // Шлем пакет чата водителю
            if (conn && conn.open) {
                conn.send({ type: 'CHAT', text: text });
            }
            
            // Отрисовываем у себя
            addMessageToBox('Вы (Пассажир)', text, 'passenger');
            input.value = '';
        }

        function addMessageToBox(sender, text, cssClass) {
            const msgEl = document.createElement('div');
            msgEl.className = `chat-msg ${cssClass}`;
            msgEl.innerHTML = `<strong>${sender}:</strong> ${text}`;
            chatBox.appendChild(msgEl);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function buildPassengerMap() {
            document.querySelectorAll('.passenger-room').forEach(el => el.remove());
            const selectA = document.getElementById('selectA');
            const selectB = document.getElementById('selectB');
            selectA.innerHTML = ''; selectB.innerHTML = '';

            mapRooms.forEach(room => {
                const el = document.createElement('div');
                el.className = 'passenger-room';
                el.id = 'p_' + room.id;
                el.innerText = room.name;
                el.style.left = room.left + 'px'; el.style.top = room.top + 'px';
                el.style.width = room.width + 'px'; el.style.height = room.height + 'px';
                mapContainer.appendChild(el);

                let optA = document.createElement('option'); optA.value = room.id; optA.text = room.name;
                let optB = document.createElement('option'); optB.value = room.id; optB.text = room.name;
                selectA.appendChild(optA); selectB.appendChild(optB);
            });
            taxiMarker.style.display = 'flex';
        }

        function moveTaxiMarker(roomId) {
            const targetRoom = mapRooms.find(r => r.id === roomId);
            if (!targetRoom) return;
            const posX = targetRoom.left + (targetRoom.width / 2) - 18;
            const posY = targetRoom.top + (targetRoom.height / 2) - 18;
            taxiMarker.style.left = posX + 'px'; taxiMarker.style.top = posY + 'px';
        }

        function sendOrder() {
            const idA = document.getElementById('selectA').value;
            const idB = document.getElementById('selectB').value;
            if (idA === idB) return alert("Выберите разные комнаты!");
            if (conn && conn.open) {
                conn.send({ type: 'NEW_ORDER', idA: idA, idB: idB });
                document.getElementById('statusBox').innerText = "Заказ отправлен! Ждём принятия...";
            }
        }
    </script>
</body>
</html>
