<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игрушечное Такси - Пассажир</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #f0fdf4; /* Слегка зеленый клиентский фон */
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #166534; font-size: 20px; margin: 5px 0; }

        /* Панель подключения */
        .connect-panel {
            width: 100%;
            max-width: 500px;
            background: #15803d;
            color: white;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 10px;
            text-align: center;
        }
        .net-input {
            width: 60%;
            padding: 8px;
            font-size: 16px;
            border-radius: 6px;
            border: none;
            text-align: center;
            font-weight: bold;
        }
        .connect-btn {
            background: #1e293b;
            color: white;
            border: none;
            padding: 8px 15px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        /* Заказ-панель */
        .order-panel {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 10px;
        }
        .status-box {
            background: #f3f4f6;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            color: #374151;
            margin-bottom: 10px;
            font-size: 15px;
            white-space: pre-line;
        }
        .selector-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .select-box {
            flex: 1;
            padding: 10px;
            font-size: 14px;
            border-radius: 8px;
            border: 2px solid #bbf7d0;
            font-weight: bold;
        }
        .order-btn {
            background: #16a34a;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
        }
        .order-btn:disabled { background: #d1d5db; color: #9ca3af; cursor: not-allowed; }

        /* Поле карты */
        .map-container { width: 100%; height: 380px; background: #cbd5e1; border-radius: 16px; position: relative; overflow: hidden; border: 3px solid #16a34a; }
        
        .passenger-room { position: absolute; background: rgba(255, 255, 255, 0.9); border: 3px solid #16803d; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #14532d; font-size: 14px; text-align: center; pointer-events: none; }
        .passenger-room.highlight-target { border-color: #ef4444; background: rgba(254, 226, 226, 0.9); box-shadow: 0 0 12px #ef4444; }

        .taxi-marker { width: 36px; height: 36px; background-color: #f59e0b; border: 3px solid #111827; border-radius: 50%; position: absolute; display: flex; align-items: center; justify-content: center; font-size: 18px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); transition: all 0.3s ease-in-out; z-index: 100; display: none; }
    </style>
</head>
<body>

    <h1>🚖 Вызов Игрушечного Такси</h1>

    <div class="connect-panel">
        <div id="connStatus" style="margin-bottom:8px; font-weight:bold;">🔴 Вы не подключены к водителю</div>
        <input type="text" id="driverIdInput" class="net-input" placeholder="Введите ID Водителя">
        <button class="connect-btn" onclick="connectToDriver()">Войти</button>
    </div>

    <div class="order-panel">
        <div id="statusBox" class="status-box">Для начала сделайте подключение по ID</div>
        
        <div class="selector-group">
            <select id="selectA" class="select-box" disabled><option>Откуда...</option></select>
            <select id="selectB" class="select-box" disabled><option>Куда...</option></select>
        </div>
        
        <button id="orderBtn" class="order-btn" onclick="sendOrder()" disabled>Заказать такси</button>
    </div>

    <div class="map-container" id="map">
        <div id="taxi" class="taxi-marker">🚖</div>
    </div>

    <script>
        let peer = null;
        let conn = null;
        let mapRooms = [];

        const mapContainer = document.getElementById('map');
        const taxiMarker = document.getElementById('taxi');

        function connectToDriver() {
            const id = document.getElementById('driverIdInput').value.trim();
            if (!id) return alert("Введите рабочий ID водителя!");

            document.getElementById('connStatus').innerText = "⏳ Подключение...";
            
            peer = new Peer();
            peer.on('open', () => {
                // Подключаемся к водителю по его ID
                conn = peer.connect(id);

                conn.on('open', () => {
                    document.getElementById('connStatus').innerText = "🟢 Успешно подключено к такси!";
                    document.getElementById('statusBox').innerText = "Карта получена. Выберите маршрут!";
                    document.getElementById('orderBtn').disabled = false;
                    document.getElementById('selectA').disabled = false;
                    document.getElementById('selectB').disabled = false;
                });

                // Слушаем пакеты данных от водителя
                conn.on('data', (data) => {
                    if (data.type === 'INIT_MAP') {
                        mapRooms = data.map;
                        buildPassengerMap();
                    }
                    if (data.type === 'MOVE_TAXI') {
                        moveTaxiMarker(data.roomId);
                    }
                    if (data.type === 'STATUS') {
                        document.getElementById('statusBox').innerText = data.text;
                    }
                    if (data.type === 'HIGHLIGHT') {
                        // Подсвечиваем пассажиру целевую комнату доставки
                        document.querySelectorAll('.passenger-room').forEach(r => r.classList.remove('highlight-target'));
                        const target = document.getElementById('p_' + data.idB);
                        if(target) target.classList.add('highlight-target');
                    }
                });

                conn.on('close', () => {
                    alert("Соединение разорвано!");
                    location.reload();
                });
            });
        }

        // Строим карту комнат, присланную водителем
        function buildPassengerMap() {
            document.querySelectorAll('.passenger-room').forEach(el => el.remove());
            
            const selectA = document.getElementById('selectA');
            const selectB = document.getElementById('selectB');
            selectA.innerHTML = ''; selectB.innerHTML = '';

            mapRooms.forEach(room => {
                // Отрисовка на карте
                const el = document.createElement('div');
                el.className = 'passenger-room';
                el.id = 'p_' + room.id;
                el.innerText = room.name;
                el.style.left = room.left + 'px'; el.style.top = room.top + 'px';
                el.style.width = room.width + 'px'; el.style.height = room.height + 'px';
                mapContainer.appendChild(el);

                // Заполнение селекторов выбора
                let optA = document.createElement('option'); optA.value = room.id; optA.text = room.name;
                let optB = document.createElement('option'); optB.value = room.id; optB.text = room.name;
                selectA.appendChild(optA); selectB.appendChild(optB);
            });

            taxiMarker.style.display = 'flex';
        }

        function moveTaxiMarker(roomId) {
            const targetRoom = mapRooms.find(r => r.id === roomId);
            if (!targetRoom) return;
            const posX = targetRoom.left + (targetRoom.width / 2) - 18;
            const posY = targetRoom.top + (targetRoom.height / 2) - 18;
            taxiMarker.style.left = posX + 'px'; taxiMarker.style.top = posY + 'px';
        }

        // Отправка заказа водителю
        function sendOrder() {
            const idA = document.getElementById('selectA').value;
            const idB = document.getElementById('selectB').value;

            if (idA === idB) return alert("Точка посадки и назначения должны отличаться!");

            if (conn && conn.open) {
                conn.send({ type: 'NEW_ORDER', idA: idA, idB: idB });
                document.getElementById('statusBox').innerText = "Заказ отправлен! Ожидание ответа водителя...";
            }
        }
    </script>
</body>
</html>
